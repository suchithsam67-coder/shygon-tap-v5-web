# CI gate set (doc 12 §3 M0.1; doc 14 §3.5). It runs on every push and pull request.
#
# Rules for this workflow (owner instruction, 2026-09-30):
#   - No secrets and no production. It references no `secrets.*`, deploys
#     nothing and mutates nothing. test:payments runs with outbound network
#     denied (scripts/ci/deny-network.mjs), so it cannot reach Supabase,
#     Razorpay or any other service.
#   - Read-only token. `permissions: contents: read`, and checkout does not
#     persist the token.
#   - Reproducible. Node comes from .nvmrc, dependencies from `npm ci`
#     (lockfile), actions are pinned by commit and gitleaks by version and
#     SHA-256.
#   - Fail-closed. Every gate stops the job, and no security gate has
#     continue-on-error.
#
# Keep the step order identical to the `ci` script in package.json, which runs
# the same gates locally.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (full history, for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: tsc -b
        run: npx tsc -b

      - name: build
        run: npx vite build

      - name: bundle check (public Tap entry JS <= 90 kB gz; DEC-2026-019)
        run: npm run test:bundle

      # V6 Stage 5: what the browser downloads carries no secret: no JWT but
      # the public anon key, no server-only setting name, no private key, no
      # live Razorpay key before G-PAY, no source map.
      - name: no secrets in the bundle
        run: npm run test:bundle-secrets

      # V6 Stage 6: robots, sitemap, canonicals, Open Graph, JSON-LD (no card
      # offers while card sales are closed), 404 and llms.txt are consistent.
      - name: SEO of the built site
        run: npm run test:seo

      # DEC-2026-023 S1 (amendment A-1): db:push refuses every project not on
      # the committed allowlist, sends only 020+, and checks before any network
      # call. Runs with outbound network denied; no credential is involved.
      - name: db:push guard
        run: npm run test:push-guard

      # apply.mjs already runs every migration a second time to prove
      # idempotency, so one invocation is the "db:apply twice" gate.
      # Since DEC-2026-023 (Option A) the database suites start from the live
      # schema baseline and apply migrations 020 onward only.
      - name: db:apply (live baseline + 020 onward, with the idempotency pass)
        run: npm run db:apply

      - name: db:verify (live baseline)
        run: npm run db:verify

      - name: rls-adversarial (live baseline)
        run: node supabase/tests/rls-adversarial.mjs

      # M0.3 U4 (DEC-2026-024 A, DEC-2026-029 A): the identity contract and the
      # paid-order claim, run twice (migrations applied once, then twice), plus
      # the 021 rollback proof.
      - name: identity contract (live baseline)
        run: npm run test:identity

      # Doc 12 §0 rule 4: /t/<slug> output byte-identical to the live baseline
      # after every migration from 020 on, and to the committed golden file.
      - name: golden public Tap (live baseline)
        run: npm run test:golden

      # Doc 12 §2: frozen function signatures, grants and bodies; no policy,
      # table grant or existing trigger changed by 020 onward, except the
      # changes an approved decision lists (each checked exactly).
      - name: admin contract (live baseline)
        run: npm run test:admin-contract

      # SHYGON V6 Stage 2 (DEC-2026-035): every table x every caller against the
      # expected access model; any access beyond it fails as a P0.
      - name: RLS matrix (live baseline)
        run: npm run test:rls-matrix

      # V6-010 / F2 (migration 022): the internal order note is not readable by
      # the customer; notes moved intact; admin contract held; rollback proven.
      - name: admin notes off customer rows (live baseline)
        run: npm run test:admin-notes

      # Every migration's header rollback restores the schema before it, and the
      # whole chain rolls back to the live baseline and re-applies identically.
      - name: migration rollbacks (live baseline)
        run: npm run test:rollbacks

      # V6-072 / migration 026: the runbook's deletion procedure, run as
      # written, deletes what the Privacy Policy says and keeps orders and
      # payments; deleting a sign-in that has orders fails instead of
      # cascading (the live baseline's defect is shown as a negative control).
      - name: account deletion procedure (live baseline)
        run: npm run test:account-deletion

      # V6-040: APPLY_ALL.sql holds only 020 onward and matches the migrations.
      - name: APPLY_ALL.sql is current
        run: npm run db:bundle:check

      # Catalogue seed data inserted by 001–019 (owner decision D-U1-a):
      # isolated PGlite, history chain only, never live.
      - name: migration-history seed checks
        run: npm run test:db:history

      - name: test:payments (outbound network denied)
        run: npm run test:payments:ci

      # SHYGON V6 Stage 3: the real payment handlers against the real schema on
      # the local stack (supabase/local/, decision D-4): success, failure,
      # cancel, retry, duplicate and replayed webhooks, bad signatures, amount
      # mismatch, first-time vs returning customers. Razorpay is the stand-in;
      # outbound network denied.
      - name: payment chain on the local stack (outbound network denied)
        run: npm run test:payment-chain

      # V6-071 / V6-073 / V6-032 (migration 025): the Tap lifecycle, the six
      # public states, field privacy and analytics, with live-baseline negative
      # controls. Outbound network denied.
      - name: public Tap lifecycle, privacy and analytics (local stack)
        run: npm run test:public-tap

      # F1 (migrations 020 and 028): every owner attack on the suspension
      # columns succeeds on the live baseline and is refused after the
      # migrations; the two admin RPCs still suspend, restore, audit and notify;
      # the attacks again over HTTP, with forged tokens. Outbound network denied.
      - name: suspension guard, adversarial (live baseline vs migrations; local stack)
        run: npm run test:suspension

      # AAROH emergency module (migration 029) and the Tap column guard (030):
      # tables and functions closed to every client role; limits, idempotency,
      # retries, receipts and retention; the owner-write bypasses with the
      # pre-030 chain as the negative control; then over HTTP with the SMS
      # stand-in (refusals, outages, timeouts, no provider, a database failure
      # mid-send, forged receipts). Outbound network denied.
      - name: emergency contacts and alerts, Tap column guard (local stack)
        run: npm run test:emergency

      # AAROH Return-to-Owner relay (migration 031): closed tables; the anonymous
      # finder and the signed-in owner over HTTP; cross-account refusals; limits,
      # duplicates, expiry, block, report, close, retention; no owner detail or
      # message text leaks. Outbound network denied.
      - name: Return-to-Owner relay (local stack)
        run: npm run test:rescue

      # V6-051 (Stage 4): the admin edge functions' role checks against the
      # real admin tables; a customer cannot reach admin by editing their
      # token or metadata. Outbound network denied.
      - name: admin edge functions, role checks (local stack)
        run: npm run test:admin-edge

      # V6-018 / V6-075 (Stage 4): structured, redacted logs with request ids;
      # security events; /api/health. Outbound network denied.
      - name: observability (local stack)
        run: npm run test:observability

      # V6 Stage 5: forged, expired and unsigned tokens are refused by every
      # customer function; the security headers meet the policy and are served
      # on every page; no foreign origin is allowed by CORS. Needs the build.
      - name: security, tokens, headers and CORS (local stack)
        run: npm run test:security

      # V6-083: the public Tap page in every state a visitor can meet.
      - name: component tests
        run: npm run test:components

      - name: Install gitleaks (pinned version, SHA-256 verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          # From the official gitleaks_8.30.1_checksums.txt release asset.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: gitleaks (full history, values redacted)
        run: npm run test:secrets

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  # SHYGON V6 Stage 5 (decision D-4): the three end-to-end journeys in a real
  # browser against the local stack, which Playwright starts itself. The
  # runner's preinstalled Chrome is used, so no browser is downloaded; every
  # request that would leave the runner is aborted by the tests.
  e2e:
    name: end-to-end journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Playwright journeys (local stack, preinstalled Chrome)
        env:
          E2E_BROWSER_CHANNEL: chrome
        run: npm run test:e2e
