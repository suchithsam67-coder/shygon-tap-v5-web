# The AAROH demo showroom: public, sample data, noindex (FE-D7).

[[redirects]]
  from = "/aaroh/experience"
  to = "/index.html"
  status = 200

# Customer Taps: the address printed on each card and encoded in its QR.
# `/tap/` is kept so links shared before the change keep resolving.

[[redirects]]
  from = "/t/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tap/*"
  to = "/index.html"
  status = 200

# Anything else is a missing page.

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
