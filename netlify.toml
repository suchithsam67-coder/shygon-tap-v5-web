[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ---------------------------------------------------------------------------
# Pinned, not left to Netlify's rolling default.
#
# @supabase/supabase-js v2.112 constructs a RealtimeClient inside createClient,
# which needs a native WebSocket — absent before Node 22. On Node 20 that throws
# at construction, so adminClient() would fail and EVERY payment function would
# return 500: no order creation, no verification, no webhook fulfilment.
# ---------------------------------------------------------------------------
[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Security headers — the same set as vercel.json (the build checks they match).
# Scripts only from this site and Razorpay Checkout; the payment window only
# from Razorpay; data only to Supabase and Razorpay; no framing of this site.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://*.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.razorpay.com; frame-src https://*.razorpay.com; media-src 'self' blob: https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=(), payment=(self \"https://api.razorpay.com\")"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ---------------------------------------------------------------------------
# Canonical host: shygontech.com
#
# The apex is the address printed on the cards (see src/lib/site.ts), so www is
# folded into it rather than served as a second copy of the site. This rule is
# inert until www.shygontech.com actually points at Netlify, so it is safe to
# ship before DNS is finished.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://www.shygontech.com/*"
  to = "https://shygontech.com/:splat"
  status = 301
  force = true

# Once shygontech.com is verified in Netlify and serving, add the same fold for
# the free Netlify host so search engines stop indexing the site twice:
#
#   [[redirects]]
#     from = "https://shygon-tech.netlify.app/*"
#     to = "https://shygontech.com/:splat"
#     status = 301
#     force = true
#
# It is deliberately NOT enabled yet. Until the custom domain resolves, that
# rule would redirect the only working host to one that does not answer — i.e.
# it would take the live site down. Deploy previews are unaffected either way;
# they run on deploy-preview-N--shygon-tech.netlify.app, a different host.

# ---------------------------------------------------------------------------
# Page routing
#
# Every public page has its own prerendered HTML file (written at build by
# the SEO plugin in vite.config.ts), whose <head> already carries that page's
# title, description, canonical URL, share image and structured data. Search
# engines and link previews read that without running JavaScript.
#
# Routes are listed explicitly rather than sent to index.html by a catch-all,
# so an unknown address gets a real 404 status (with the app's own 404 page)
# instead of a "soft 404" that search engines index as a duplicate home page.
# The build fails if a prerendered page has no rule here.
# ---------------------------------------------------------------------------

# Forced: /index.html exists, and without force a file at the path wins.
[[redirects]]
  from = "/"
  to = "/shygontap"
  status = 301
  force = true

[[redirects]]
  from = "/shygontap"
  to = "/shygontap.html"
  status = 200

[[redirects]]
  from = "/shygontap/store"
  to = "/shygontap/store.html"
  status = 200

# SHYGON Version 1 — AAROH (DEC-2026-036, DEC-2026-037). Before the card
# pages, so "aaroh" is never read as a card id.
[[redirects]]
  from = "/shygontap/store/aaroh"
  to = "/shygontap/store/aaroh.html"
  status = 200

# An edition's address opens the AAROH page with that edition selected.
[[redirects]]
  from = "/shygontap/store/aaroh/*"
  to = "/shygontap/store/aaroh?design=:splat"
  status = 301

